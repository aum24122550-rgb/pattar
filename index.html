<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>แอดมินแดชบอร์ด</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>แอดมินแดชบอร์ด</h1>
    <p>สรุปจำนวนสมาชิก สูตรทั้งหมด และสูตรยอดนิยม</p>
    <nav class="top-nav">
      <a href="index.html">หน้าแรก</a>
      <a href="admin.html" aria-current="page">แอดมิน</a>
    </nav>
  </header>

  <main id="adminDashboard" class="admin-grid">
    <section class="card admin-stat">
      <h3>จำนวนสมาชิก</h3>
      <p id="memberCount" class="admin-number">-</p>
    </section>

    <section class="card admin-stat">
      <h3>จำนวนสูตรทั้งหมด</h3>
      <p id="recipeCount" class="admin-number">-</p>
    </section>

    <section class="card admin-popular">
      <h3>สูตรยอดนิยม</h3>
      <p class="admin-subtext">จัดอันดับจากจำนวนรีวิวและคะแนนเฉลี่ย</p>
      <div id="popularRecipes"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
