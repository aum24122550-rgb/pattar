<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เว็บแนะนำสูตรอาหาร - หน้าแรก</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>เว็บแนะนำสูตรอาหาร สำหรับผู้ป่วยโรคไต (ระยะก่อนฟอกไต)</h1>
    <p>รวมสูตรอาหารง่าย ๆ สำหรับทำที่บ้าน</p>
    <div class="filters">
      <label for="kidneyStage">เลือกระยะไต:</label>
      <select id="kidneyStage">
        <option value="all">ทุกระยะ (ก่อนฟอกไต)</option>
        <option value="stage3">ระยะที่ 3</option>
        <option value="stage4">ระยะที่ 4</option>
        <option value="stage5">ระยะที่ 5 ก่อนฟอกไต</option>
      </select>
    </div>
    <p id="stageGuide" class="stage-guide">ทุกเมนูจะแสดงป้ายว่าเหมาะกับระยะไตใด โดยคำนึงถึงโซเดียม โพแทสเซียม ฟอสฟอรัส และแคลเซียม</p>
    <input id="search" placeholder="ค้นหาสูตรหรือวัตถุดิบ..." />
  </header>

  <main id="list"></main>

  <script src="script.js"></script>
</body>
</html>
